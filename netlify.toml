[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Next.js runtime for Netlify is auto-detected; these keep server routes + middleware + ISR working.
[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

# Baseline transport, framing and browser-permission headers on every page.
# Android package: correct MIME type, never cached under a stale name.
[[headers]]
  for = "/app/*.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    X-DNS-Prefetch-Control = "off"
    # Content-Security-Policy: blocks injected third-party scripts, framing of
    # our checkout by other sites, and form posts to foreign domains. The only
    # allowed third parties are Supabase (data/auth), Razorpay (payments) and
    # Meta Pixel (already used on the storefront).
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' https://checkout.razorpay.com https://connect.facebook.net https://www.facebook.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.razorpay.com https://lumberjack.razorpay.com https://connect.facebook.net https://www.facebook.com; frame-src 'self' https://checkout.razorpay.com https://api.razorpay.com; media-src 'self' https:; worker-src 'self' blob:; upgrade-insecure-requests"
